services:
  - type: web
    name: spotmatrix-fullstack
    env: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: ENABLE_MEMORY_FALLBACK
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
